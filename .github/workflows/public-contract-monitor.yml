name: QAZ.INDUSTRIES public contract monitor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qaz-industries-public-contract-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, qdev-ci, "qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-probe"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Probe upstream public contracts
        id: upstream
        continue-on-error: true
        run: python3 scripts/probe_public_contracts.py --output-dir /tmp/qaz-industries-contract-probe
      - name: Verify checked-in release contracts
        id: checked_in
        if: always()
        continue-on-error: true
        run: scripts/check.sh
      - name: Upload read-only probe output
        if: always()
        env:
          QDEV_IF_NO_FILES: warn
        run: .github/scripts/qdev-upload-artifact.sh qaz-industries-public-contract-probe '/tmp/qaz-industries-contract-probe/*.json'
      - name: Enforce aggregate result
        if: always()
        env:
          UPSTREAM_OUTCOME: ${{ steps.upstream.outcome }}
          CHECKED_IN_OUTCOME: ${{ steps.checked_in.outcome }}
        run: |
          test "$UPSTREAM_OUTCOME" = success
          test "$CHECKED_IN_OUTCOME" = success
