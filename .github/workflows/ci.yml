name: QAZ.INDUSTRIES checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qaz-industries-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: belilovsky/ecosystem/.github/workflows/quality-v3.yml@main
    with:
      runtime: static
      manifest_path: qdev-project.json
      install_command: npm ci
      lint_command: npm run lint
      typecheck_command: ""
      test_command: npm test
      build_command: npm run build
      security_command: npm run security
