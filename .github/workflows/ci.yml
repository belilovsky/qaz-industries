name: QAZ.INDUSTRIES checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qaz-industries-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # GitHub does not expose a private reusable workflow to this public repo.
    # This local copy is provenance-bound to ecosystem@1ac51dd7bcab782f2edfe0482165681387ad72f2.
    uses: ./.github/workflows/quality-v3.yml
    with:
      runtime: static
      manifest_path: qdev-project.json
      install_command: npm ci
      lint_command: npm run lint
      typecheck_command: ""
      test_command: npm test
      build_command: npm run build
      security_command: npm run security
